name: PyPI Build and Upload

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  # cpython versions to build wheels for.
  PYTHON_VERSIONS: cp39 cp310 cp311 cp312 cp313 cp314

jobs:
  PyPi_Linux_x86_64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp310, cp311, cp312, cp313, cp314]
        manylinux_image: [manylinux2014_x86_64, manylinux_2_28_x86_64, manylinux_2_34_x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PyBoolector Build (${{ matrix.python }} on ${{ matrix.manylinux_image }})
        run: |
          docker run \
            -e BUILD_NUM=${{ github.run_id }} \
            -e PYTHON_VERSIONS="${{ matrix.python }}" \
            -v ${{ github.workspace }}:/boolector \
            quay.io/pypa/${{ matrix.manylinux_image }} \
            /boolector/pypi/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: result/dist
          name: dist-linux-x86_64-${{ matrix.python }}-${{ matrix.manylinux_image }}

